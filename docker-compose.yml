version: "3"

services:
  kanban:
    # Pinned to the version the v2.1 route work was verified against (see
    # commit 764821a) for reproducible integration runs. Bump deliberately.
    image: ghcr.io/plankanban/planka:2.1.1
    container_name: kanban
    restart: unless-stopped
    ports:
      - "${PLANKA_PORT}:1337"
    environment:
      - BASE_URL=${BASE_URL}
      - TRUST_PROXY=${TRUST_PROXY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SECRET_KEY=${SECRET_KEY}
      # Admin credentials
      - DEFAULT_ADMIN_EMAIL=${PLANKA_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${PLANKA_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${PLANKA_ADMIN_NAME}
      - DEFAULT_ADMIN_USERNAME=${PLANKA_ADMIN_USERNAME}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kanban-files:/app/public/user-files
      - kanban-user-avatars:/app/public/user-avatars
      - kanban-project-background-images:/app/public/project-background-images
      - kanban-attachments:/app/private/attachments

  postgres:
    image: postgres:15-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: volume
        source: kanban-db
        target: /var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"

  # The Go MCP server. Profile-gated so the default `up` (Planka + Postgres for
  # integration tests) is unaffected; run with `docker compose --profile mcp up -d`.
  # Published to host loopback only — the process holds Planka admin creds.
  kanban-mcp:
    image: ghcr.io/cameronsjo/kanban-mcp:latest
    container_name: kanban-mcp
    restart: unless-stopped
    profiles: ["mcp"]
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      - PLANKA_BASE_URL=${PLANKA_BASE_URL:-http://kanban:1337}
      - PLANKA_AGENT_EMAIL=${PLANKA_AGENT_EMAIL}
      - PLANKA_AGENT_PASSWORD=${PLANKA_AGENT_PASSWORD}
      - PLANKA_ADMIN_ID=${PLANKA_ADMIN_ID}
      - PLANKA_MCP_AUTH_TOKEN=${PLANKA_MCP_AUTH_TOKEN:-}
    depends_on:
      - kanban

volumes:
  kanban-db:
    name: kanban-db-persistent
  kanban-files:
  kanban-user-avatars:
  kanban-project-background-images:
  kanban-attachments:
